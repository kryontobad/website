<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>TeleCommand Remote Desktop</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#12141c; color:#e0e0e0; font-family:system-ui, sans-serif; padding:16px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
        .container { width:100%; max-width:800px; background:#1a1e29; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,0.4); padding:22px 18px; display:flex; flex-direction:column; gap:18px; }
        .header { display:flex; align-items:center; gap:10px; }
        .status-dot { width:14px; height:14px; border-radius:50%; background:#ff4d4d; flex-shrink:0; }
        .status-dot.connecting { background:#ffa500; }
        .status-dot.online { background:#00e676; }
        h1 { font-size:1.6rem; font-weight:700; color:#00d4ff; }
        .buttons { display:flex; flex-wrap:wrap; gap:8px; }
        button { background:#212736; border:1px solid #3a4055; color:#e0e0e0; padding:12px 16px; border-radius:12px; font-size:0.9rem; font-weight:600; cursor:pointer; flex:1 1 auto; min-width:100px; text-align:center; transition:0.2s; }
        button:hover { background:#2a3040; border-color:#00d4ff; }
        button.danger { border-color:#ff5252; color:#ff8a80; }
        button.danger:hover { background:#392d36; border-color:#ff5252; }
        button:disabled { opacity:0.4; pointer-events:none; }
        .screen-box { width:100%; background:#0a0d14; border-radius:12px; overflow:hidden; border:1px solid #2a2f3f; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
        video { width:100%; height:100%; object-fit:contain; background:#000; cursor:crosshair; }
        label { display:block; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#8b92a8; margin-bottom:4px; }
        textarea { width:100%; background:#0e1118; border:1px solid #2a2f3f; border-radius:10px; padding:12px; color:#c0caf5; font-family:monospace; font-size:0.8rem; resize:vertical; min-height:90px; outline:none; }
        textarea:focus { border-color:#00d4ff; }
        textarea[readonly] { background:#0a0d14; }
        .log-box { background:#0a0d14; border:1px solid #1e2332; border-radius:12px; padding:12px; font-family:monospace; font-size:0.8rem; color:#b4c0e0; max-height:180px; overflow-y:auto; word-break:break-word; }
        .log-entry { padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
        .log-entry .time { color:#6b7394; margin-right:6px; }
        #keyCapture { position:absolute; opacity:0; width:1px; height:1px; border:none; outline:none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status-dot" id="statusDot"></div>
            <h1>TeleCommand Remote Desktop</h1>
        </div>

        <div class="buttons">
            <button id="generateOfferBtn">📡 Connect</button>
            <button id="setAnswerBtn" class="danger" disabled>🔐 Set Answer</button>
            <button id="disconnectBtn" class="danger" disabled>⏹ Disconnect</button>
            <button id="keyboardBtn" disabled>⌨️ Keyboard</button>
        </div>

        <div class="screen-box">
            <video id="remoteScreen" autoplay playsinline muted></video>
        </div>

        <div>
            <label>📤 Offer SDP (copy & send to Telegram bot)</label>
            <textarea id="offerSdp" readonly placeholder="Click 'Connect' to create..."></textarea>
        </div>

        <div>
            <label>📥 Answer SDP (paste from Telegram bot reply)</label>
            <textarea id="answerSdp" placeholder="Paste the answer SDP here..."></textarea>
        </div>

        <input type="text" id="keyCapture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

        <div class="log-box" id="logContainer">
            <div class="log-entry">🟢 Ready. Connect to start.</div>
        </div>
    </div>

    <script>
        // ------------------- State -------------------
        let peerConnection = null;
        let dataChannel = null;
        let connectionState = 'idle';

        const offerTextarea = document.getElementById('offerSdp');
        const answerTextarea = document.getElementById('answerSdp');
        const statusDot = document.getElementById('statusDot');
        const generateBtn = document.getElementById('generateOfferBtn');
        const setAnswerBtn = document.getElementById('setAnswerBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const keyboardBtn = document.getElementById('keyboardBtn');
        const logContainer = document.getElementById('logContainer');
        const remoteScreen = document.getElementById('remoteScreen');
        const keyCapture = document.getElementById('keyCapture');

        function updateUI(state) {
            connectionState = state;
            statusDot.className = 'status-dot';
            if (state === 'connecting') statusDot.classList.add('connecting');
            if (state === 'connected') statusDot.classList.add('online');

            generateBtn.disabled = (state === 'connecting');
            setAnswerBtn.disabled = (state !== 'connecting');
            disconnectBtn.disabled = (state === 'idle');
            keyboardBtn.disabled = (state !== 'connected');
        }

        function addLog(msg, isError = false) {
            const now = new Date().toLocaleTimeString('en-US', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="time">[${now}]</span> ${escapeHtml(msg)}`;
            if (isError) entry.style.color = '#ff8888';
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            while (logContainer.children.length > 150) logContainer.removeChild(logContainer.firstChild);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, c => map[c]);
        }

        function sanitizeSdp(sdp) {
            if (!sdp || typeof sdp !== 'string') return sdp;
            
            const rawLines = sdp.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            const sessionLines = [];
            const mediaBlocks = [];
            let currentBlock = null;

            for (const line of rawLines) {
                if (line.startsWith('m=')) {
                    if (currentBlock) mediaBlocks.push(currentBlock);
                    currentBlock = [line];
                } else {
                    if (!currentBlock) sessionLines.push(line);
                    else currentBlock.push(line);
                }
            }
            if (currentBlock) mediaBlocks.push(currentBlock);

            const outputLines = [...sessionLines];

            for (const block of mediaBlocks) {
                const mLine = block[0];
                const cB = [], mid = [], ufrag = [], pwd = [], fp = [], setup = [], sctp = [], candidates = [], endCandidates = [], other = [];

                for (let i = 1; i < block.length; i++) {
                    const line = block[i];
                    if (line.startsWith('c=') || line.startsWith('b=')) cB.push(line);
                    else if (line.startsWith('a=mid:')) mid.push(line);
                    else if (line.startsWith('a=ice-ufrag:')) ufrag.push(line);
                    else if (line.startsWith('a=ice-pwd:')) pwd.push(line);
                    else if (line.startsWith('a=fingerprint:')) fp.push(line);
                    else if (line.startsWith('a=setup:')) setup.push(line);
                    else if (line.startsWith('a=sctp-port:') || line.startsWith('a=max-message-size:')) sctp.push(line);
                    else if (line.startsWith('a=candidate:')) candidates.push(line);
                    else if (line.startsWith('a=end-of-candidates')) endCandidates.push(line);
                    else other.push(line);
                }

                outputLines.push(mLine, ...cB, ...mid, ...ufrag, ...pwd, ...fp, ...setup, ...sctp, ...other, ...candidates, ...endCandidates);
            }

            return outputLines.join('\r\n') + '\r\n';
        }

        async function generateOffer() {
            if (connectionState !== 'idle') {
                addLog('Already busy.', true);
                return;
            }
            try {
                closeConnection();
                addLog('Creating peer connection...');
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // 🔥 CRITICAL: Force browser to expect incoming video (screen)
                peerConnection.addTransceiver('video', { direction: 'recvonly' });

                // Data channel for control messages
                dataChannel = peerConnection.createDataChannel('control', { ordered: true });
                setupDataChannel(dataChannel);

                // Incoming video (screen)
                peerConnection.addEventListener('track', (event) => {
                    addLog(`📺 Received track: ${event.track.kind}`);
                    if (event.track.kind === 'video') {
                        remoteScreen.srcObject = event.streams[0];
                        remoteScreen.play().catch(e => addLog('Autoplay failed: ' + e.message, true));
                    }
                });

                peerConnection.addEventListener('iceconnectionstatechange', () => {
                    addLog(`ICE state: ${peerConnection.iceConnectionState}`);
                    if (peerConnection.iceConnectionState === 'failed' || peerConnection.iceConnectionState === 'disconnected') {
                        addLog('ICE connection lost.', true);
                        closeConnection();
                    }
                });

                peerConnection.addEventListener('icegatheringstatechange', () => {
                    addLog(`Gathering state: ${peerConnection.iceGatheringState}`);
                });

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                await new Promise(resolve => {
                    if (peerConnection.iceGatheringState === 'complete') resolve();
                    else peerConnection.addEventListener('icegatheringstatechange', function h() {
                        if (peerConnection.iceGatheringState === 'complete') {
                            peerConnection.removeEventListener('icegatheringstatechange', h);
                            resolve();
                        }
                    });
                });

                offerTextarea.value = peerConnection.localDescription.sdp;
                addLog('📤 Offer ready. Copy and send to Telegram.');
                updateUI('connecting');
                answerTextarea.value = '';
            } catch (err) {
                addLog('Error: ' + err.message, true);
                closeConnection();
            }
        }

        function setupDataChannel(channel) {
            channel.addEventListener('open', () => {
                addLog('✅ Data channel open. You can now control the remote.');
                updateUI('connected');
            });
            channel.addEventListener('close', () => {
                addLog('🔒 Data channel closed.');
                updateUI('idle');
            });
            channel.addEventListener('error', (e) => addLog('Data channel error.', true));
        }

        async function setAnswer() {
            if (!peerConnection || connectionState !== 'connecting') {
                addLog('No pending offer.', true);
                return;
            }

            const raw = answerTextarea.value.trim();
            if (!raw.startsWith('v=')) {
                addLog('Invalid SDP.', true);
                return;
            }

            const cleaned = sanitizeSdp(raw);
            if (cleaned !== raw) {
                addLog('SDP sanitised (setup moved before candidates).');
                answerTextarea.value = cleaned;
            }

            try {
                addLog('Setting remote description...');
                await peerConnection.setRemoteDescription({ type: 'answer', sdp: cleaned });
                addLog('Answer set. Waiting for ICE...');
            } catch (err) {
                addLog('Failed: ' + err.message, true);
                closeConnection();
            }
        }

        function sendJSON(obj) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(obj));
            }
        }

        // ---------- Mouse / Touch on video ----------
        function getRelativePos(e, element) {
            const rect = element.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const xRatio = (clientX - rect.left) / rect.width;
            const yRatio = (clientY - rect.top) / rect.height;
            return { x: Math.min(Math.max(xRatio, 0), 1), y: Math.min(Math.max(yRatio, 0), 1) };
        }

        remoteScreen.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            const button = e.button === 2 ? 'right' : 'left';
            sendJSON({ type: 'mouse_down', x: pos.x, y: pos.y, button: button });
        });

        remoteScreen.addEventListener('mousemove', (e) => {
            if (e.buttons === 0) return; // only when dragging
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            sendJSON({ type: 'mouse_move', x: pos.x, y: pos.y });
        });

        remoteScreen.addEventListener('mouseup', (e) => {
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            const button = e.button === 2 ? 'right' : 'left';
            sendJSON({ type: 'mouse_up', x: pos.x, y: pos.y, button: button });
        });

        remoteScreen.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            sendJSON({ type: 'mouse_click', x: pos.x, y: pos.y, button: 'right' });
        });

        // Touch events
        remoteScreen.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            sendJSON({ type: 'mouse_down', x: pos.x, y: pos.y, button: 'left' });
        }, { passive: false });

        remoteScreen.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            sendJSON({ type: 'mouse_move', x: pos.x, y: pos.y });
        }, { passive: false });

        remoteScreen.addEventListener('touchend', (e) => {
            e.preventDefault();
            const pos = getRelativePos(e, remoteScreen);
            sendJSON({ type: 'mouse_up', x: pos.x, y: pos.y, button: 'left' });
        }, { passive: false });

        // ---------- Keyboard ----------
        keyboardBtn.addEventListener('click', () => {
            keyCapture.focus();
            addLog('⌨️ Keyboard focused. Type to send keys.');
        });

        keyCapture.addEventListener('keydown', (e) => {
            e.preventDefault();
            const key = e.key;
            if (key.length === 1) {
                sendJSON({ type: 'key_press', key: key });
            } else {
                sendJSON({ type: 'key_press', key: key.toLowerCase() });
            }
        });

        function closeConnection() {
            if (peerConnection) {
                try { peerConnection.close(); } catch(e) {}
                peerConnection = null;
            }
            dataChannel = null;
            remoteScreen.srcObject = null;
            updateUI('idle');
            offerTextarea.value = '';
            answerTextarea.value = '';
        }

        function disconnect() {
            if (connectionState !== 'idle') {
                addLog('Disconnecting...');
                closeConnection();
            }
        }

        generateBtn.addEventListener('click', generateOffer);
        setAnswerBtn.addEventListener('click', setAnswer);
        disconnectBtn.addEventListener('click', disconnect);

        updateUI('idle');
    </script>
</body>
</html>
