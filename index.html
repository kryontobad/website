<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TeleCommand Remote</title>
    <style>
        :root {
            --bg: #0b0f17;
            --glass: rgba(20, 25, 40, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00f7ff;
            --accent2: #b800ff;
            --text: #e0e0e0;
            --log-bg: rgba(0, 0, 0, 0.3);
            --danger: #ff4d4d;
            --success: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0f17 0%, #1a1f35 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 247, 255, 0.12), transparent 70%);
            top: -150px;
            left: -150px;
            animation: float1 8s infinite alternate;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(180, 0, 255, 0.1), transparent 70%);
            bottom: -120px;
            right: -100px;
            animation: float2 10s infinite alternate;
        }

        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-30px, -40px) scale(1.05); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 700px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff4d4d;
            box-shadow: 0 0 12px currentColor;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.online {
            background: #00ff88;
            box-shadow: 0 0 18px #00ff88;
        }

        .status-dot.connecting {
            background: #ffa500;
            box-shadow: 0 0 14px #ffa500;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(to right, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            outline: none;
            white-space: nowrap;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.3);
        }

        button.danger {
            border-color: var(--danger);
        }

        button.danger:hover {
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
        }

        button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .sdp-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #aaa;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: #c0caf5;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.8rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            min-height: 100px;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        textarea[readonly] {
            background: rgba(0, 0, 0, 0.4);
            cursor: default;
        }

        .log-section {
            flex: 1;
            background: var(--log-bg);
            border-radius: 16px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Cascadia Code', monospace;
            font-size: 0.85rem;
            color: #c0caf5;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 220px;
            scrollbar-width: thin;
            scrollbar-color: #2a2f45 #0b0f17;
        }

        .log-section::-webkit-scrollbar {
            width: 6px;
        }

        .log-section::-webkit-scrollbar-track {
            background: #0b0f17;
        }

        .log-section::-webkit-scrollbar-thumb {
            background: #2a2f45;
            border-radius: 3px;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            word-break: break-all;
        }

        .timestamp {
            color: #7a7fa0;
            margin-right: 8px;
        }

        .command-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .command-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px 16px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .command-row input:focus {
            border-color: var(--accent);
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
                gap: 16px;
            }
            button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status-dot" id="statusDot"></div>
            <h1>TeleCommand Remote</h1>
        </div>

        <div class="controls">
            <button id="generateOfferBtn">📡 Generate Offer</button>
            <button id="setAnswerBtn" class="danger" disabled>🔐 Set Answer</button>
            <button id="disconnectBtn" class="danger" disabled>⏹ Disconnect</button>
        </div>

        <div class="sdp-section">
            <div class="field">
                <label>📤 Offer SDP (copy & send to Telegram bot)</label>
                <textarea id="offerSdp" readonly placeholder="Click 'Generate Offer' to create..."></textarea>
            </div>
            <div class="field">
                <label>📥 Answer SDP (paste from Telegram bot reply)</label>
                <textarea id="answerSdp" placeholder="Paste the answer SDP here..."></textarea>
            </div>
        </div>

        <div class="command-row">
            <input type="text" id="commandInput" value="/run" placeholder="Command (e.g., /run)">
            <button id="sendCommandBtn" disabled>⚡ Send</button>
        </div>

        <div class="log-section" id="logContainer">
            <div class="log-entry">🟢 Ready. Generate an offer to start.</div>
        </div>
    </div>

    <script>
        // ------------------- State -------------------
        let peerConnection = null;
        let dataChannel = null;
        let connectionState = 'idle'; // idle | connecting | connected

        const offerTextarea = document.getElementById('offerSdp');
        const answerTextarea = document.getElementById('answerSdp');
        const statusDot = document.getElementById('statusDot');
        const generateBtn = document.getElementById('generateOfferBtn');
        const setAnswerBtn = document.getElementById('setAnswerBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendCommandBtn = document.getElementById('sendCommandBtn');
        const commandInput = document.getElementById('commandInput');
        const logContainer = document.getElementById('logContainer');

        // ------------------- Helpers -------------------
        function updateConnectionState(state) {
            connectionState = state;
            statusDot.className = 'status-dot';
            if (state === 'connecting') statusDot.classList.add('connecting');
            if (state === 'connected') statusDot.classList.add('online');

            generateBtn.disabled = (state === 'connecting');
            setAnswerBtn.disabled = (state !== 'connecting');
            disconnectBtn.disabled = (state === 'idle');
            sendCommandBtn.disabled = (state !== 'connected');
        }

        function addLog(msg, isError = false) {
            const now = new Date().toLocaleTimeString('en-US', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="timestamp">[${now}]</span> ${escapeHtml(msg)}`;
            if (isError) entry.style.color = '#ff8888';
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            while (logContainer.children.length > 150) logContainer.removeChild(logContainer.firstChild);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, c => map[c]);
        }

        // ------------------- WebRTC -------------------
        async function generateOffer() {
            if (connectionState !== 'idle') {
                addLog('❌ Already busy. Disconnect first.', true);
                return;
            }
            try {
                // Clean up any previous connection
                closePeerConnection();

                addLog('🔧 Creating peer connection...');
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                dataChannel = peerConnection.createDataChannel('command', { ordered: true });
                setupDataChannel(dataChannel);

                peerConnection.addEventListener('iceconnectionstatechange', () => {
                    addLog(`🔗 ICE state: ${peerConnection.iceConnectionState}`);
                    if (peerConnection.iceConnectionState === 'failed' || peerConnection.iceConnectionState === 'disconnected') {
                        addLog('❌ ICE connection lost.', true);
                        closePeerConnection();
                    }
                });

                peerConnection.addEventListener('icegatheringstatechange', () => {
                    addLog(`🧊 Gathering state: ${peerConnection.iceGatheringState}`);
                });

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Wait for ICE gathering to complete
                await new Promise((resolve) => {
                    if (peerConnection.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        peerConnection.addEventListener('icegatheringstatechange', function handler() {
                            if (peerConnection.iceGatheringState === 'complete') {
                                peerConnection.removeEventListener('icegatheringstatechange', handler);
                                resolve();
                            }
                        });
                    }
                });

                const fullOffer = peerConnection.localDescription.sdp;
                if (fullOffer.length > 4096) {
                    addLog('❌ Offer SDP too long (>4096 chars). Connection might fail.', true);
                }

                offerTextarea.value = fullOffer;
                addLog('📤 Offer generated. Copy and send it to your Telegram bot chat.');
                updateConnectionState('connecting');
                answerTextarea.value = '';
                answerTextarea.focus();
            } catch (err) {
                addLog(`❌ Error generating offer: ${err.message}`, true);
                closePeerConnection();
            }
        }

        async function setAnswer() {
            if (!peerConnection || connectionState !== 'connecting') {
                addLog('⚠️ No pending offer to answer.', true);
                return;
            }

            const answerSdp = answerTextarea.value.trim();
            if (!answerSdp.startsWith('v=')) {
                addLog('❌ Invalid answer SDP (must start with "v=").', true);
                return;
            }

            try {
                addLog('📥 Setting remote description...');
                const answer = new RTCSessionDescription({ type: 'answer', sdp: answerSdp });
                await peerConnection.setRemoteDescription(answer);
                addLog('✅ Answer set. Waiting for ICE connection...');
                // Connection state will be updated by ICE event
            } catch (err) {
                addLog(`❌ Failed to set answer: ${err.message}`, true);
                closePeerConnection();
            }
        }

        function setupDataChannel(channel) {
            channel.addEventListener('open', () => {
                addLog('✅ Data channel open. You can now send commands.');
                updateConnectionState('connected');
            });

            channel.addEventListener('close', () => {
                addLog('🔒 Data channel closed.');
                updateConnectionState('idle');
            });

            channel.addEventListener('error', (err) => {
                addLog(`⚠️ Data channel error: ${err.message || 'unknown'}`, true);
            });
        }

        function sendCommand() {
            if (!dataChannel || dataChannel.readyState !== 'open') {
                addLog('❌ Data channel not open.', true);
                return;
            }
            const command = commandInput.value.trim();
            if (!command) return;
            try {
                dataChannel.send(command);
                addLog(`📨 Sent: ${command}`);
                commandInput.value = '/run'; // reset to default
            } catch (err) {
                addLog(`❌ Send failed: ${err.message}`, true);
            }
        }

        function closePeerConnection() {
            if (peerConnection) {
                try { peerConnection.close(); } catch (e) {}
                peerConnection = null;
            }
            dataChannel = null;
            updateConnectionState('idle');
            offerTextarea.value = '';
            answerTextarea.value = '';
        }

        function disconnect() {
            if (connectionState !== 'idle') {
                addLog('⏹ Disconnecting...');
                closePeerConnection();
                addLog('🚫 WebRTC disconnected.');
            }
        }

        // ------------------- Event Listeners -------------------
        generateBtn.addEventListener('click', generateOffer);
        setAnswerBtn.addEventListener('click', setAnswer);
        disconnectBtn.addEventListener('click', disconnect);
        sendCommandBtn.addEventListener('click', sendCommand);

        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendCommand();
        });

        // Initial state
        updateConnectionState('idle');
    </script>
</body>
</html>
